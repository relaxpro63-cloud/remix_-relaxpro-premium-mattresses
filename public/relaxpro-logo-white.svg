<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 185" width="440" height="185">
  <defs>
    <style>
      .lw-letter { font-family: Georgia, 'Times New Roman', serif; font-weight: 900; font-size: 72px; fill: #FFFFFF; }
      .lw-pro { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 24px; fill: #6FAEE0; letter-spacing: 1px; }
      .lw-bed { stroke: #FFFFFF; }
      .lw-bed-fill { fill: #FFFFFF; }
      .lw-spring { stroke: #6FAEE0; }
      .lw-spring-fill { fill: #6FAEE0; }
      .lw-tagline-bg { fill: rgba(255,255,255,0.12); }
      .lw-tagline { font-family: Georgia, serif; font-style: italic; font-weight: bold; font-size: 11.5px; fill: #6FAEE0; text-anchor: middle; }
      .lw-sub { font-family: system-ui, -apple-system, sans-serif; font-weight: bold; font-size: 10px; fill: rgba(255,255,255,0.4); text-anchor: middle; letter-spacing: 1.2; }
    </style>
  </defs>
  <text x="35" y="98" class="lw-letter">R</text>
  <text x="100" y="98" class="lw-letter">E</text>
  <text x="162" y="98" class="lw-letter">L</text>
  <text x="218" y="98" class="lw-letter">A</text>
  <text x="290" y="98" class="lw-letter">X</text>
  <!-- Bed icon -->
  <path d="M 211,44 L 239,20 L 267,44" class="lw-bed" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <rect x="254" y="24" width="6" height="12" class="lw-bed-fill"/>
  <rect x="235" y="29" width="8" height="8" rx="1.5" fill="none" class="lw-bed" stroke-width="1.5"/>
  <line x1="239" y1="29" x2="239" y2="37" class="lw-bed" stroke-width="1.2"/>
  <line x1="235" y1="33" x2="243" y2="33" class="lw-bed" stroke-width="1.2"/>
  <!-- Mattress springs -->
  <line x1="211" y1="72" x2="211" y2="92" class="lw-spring" stroke-width="3" stroke-linecap="round"/>
  <line x1="267" y1="72" x2="267" y2="92" class="lw-spring" stroke-width="3" stroke-linecap="round"/>
  <line x1="211" y1="81" x2="267" y2="81" class="lw-spring" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="218" y1="81" x2="218" y2="92" class="lw-spring" stroke-width="2.2"/>
  <line x1="260" y1="81" x2="260" y2="92" class="lw-spring" stroke-width="2.2"/>
  <rect x="216" y="75" width="13" height="5" rx="1" class="lw-spring-fill"/>
  <path d="M 218,75 Q 228,68 238,75 T 258,75" class="lw-spring" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- PRO badge -->
  <text x="348" y="52" class="lw-pro">PRO</text>
  <!-- Tagline -->
  <rect x="110" y="122" width="220" height="23" rx="11.5" class="lw-tagline-bg"/>
  <text x="220" y="137" class="lw-tagline">Sleep Better Wake Better</text>
  <text x="220" y="172" class="lw-sub">MATTRESSES • SOFAS • INTERIORS</text>
</svg>
