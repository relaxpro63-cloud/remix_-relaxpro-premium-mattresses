<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <!-- Soft embossed effect with light-on-dark shadow -->
    <filter id="emboss-dark" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Light highlight offset (top-left) -->
      <feDropShadow dx="-0.5" dy="-0.5" stdDeviation="0.4" flood-color="#A6CDEC" flood-opacity="0.15" />
      <!-- Shadow offset (bottom-right) creates depth -->
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.4" flood-color="#000000" flood-opacity="0.20" />
    </filter>

    <!-- Small rounded leaf/petal motif — pale sapphire for dark bg -->
    <g id="leaf-motif-dark" filter="url(#emboss-dark)">
      <!-- Rounded teardrop leaf body -->
      <path d="M0,9 C2,3 7,0 11,0 C15,0 18,2 18,6 C18,10 14,14 11,17 C7,14 3,12 0,9Z" 
            fill="#D9F2FB" />
      <!-- Fine center vein -->
      <path d="M0,9 C4,6 8,3 11,0" stroke="#FFFFFF" stroke-width="0.2" fill="none" stroke-linecap="round" />
    </g>

    <!-- Repeating pattern -->
    <pattern id="footer-pattern" x="0" y="0" width="180" height="180" patternUnits="userSpaceOnUse">
      <!-- Center leaf at 45° -->
      <use href="#leaf-motif-dark" x="90" y="90" transform="rotate(45 90 90)" opacity="0.03" />
      
      <!-- Diagonal offset leaves for organic rhythm -->
      <use href="#leaf-motif-dark" x="90" y="-90" transform="rotate(45 90 -90)" opacity="0.03" />
      <use href="#leaf-motif-dark" x="90" y="270" transform="rotate(45 90 270)" opacity="0.03" />
      <use href="#leaf-motif-dark" x="-90" y="90" transform="rotate(45 -90 90)" opacity="0.03" />
      <use href="#leaf-motif-dark" x="270" y="90" transform="rotate(45 270 90)" opacity="0.03" />
    </pattern>
  </defs>

  <!-- Transparent background — the footer gradient shows through -->
  <rect width="100%" height="100%" fill="url(#footer-pattern)" />
</svg>
