<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <!-- Soft embossed effect filter -->
    <filter id="emboss" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Shadow offset (down-right) creates depth illusion -->
      <feDropShadow dx="0.6" dy="0.6" stdDeviation="0.5" flood-color="#B5D8EE" flood-opacity="0.20" />
      <!-- Highlight offset (up-left) creates raised edge illusion -->
      <feDropShadow dx="-0.5" dy="-0.5" stdDeviation="0.4" flood-color="#FFFFFF" flood-opacity="0.25" />
    </filter>

    <!-- Small rounded leaf/petal motif -->
    <g id="leaf-motif" filter="url(#emboss)">
      <!-- Rounded teardrop leaf body -->
      <path d="M0,9 C2,3 7,0 11,0 C15,0 18,2 18,6 C18,10 14,14 11,17 C7,14 3,12 0,9Z" 
            fill="#D9F2FB" />
      <!-- Fine center vein -->
      <path d="M0,9 C4,6 8,3 11,0" stroke="#C0E3F5" stroke-width="0.3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Repeating pattern -->
    <pattern id="luxury-pattern" x="0" y="0" width="180" height="180" patternUnits="userSpaceOnUse">
      <!-- Center leaf at 45° -->
      <use href="#leaf-motif" x="90" y="90" transform="rotate(45 90 90)" opacity="0.05" />
      
      <!-- Diagonal offset leaves for organic rhythm -->
      <use href="#leaf-motif" x="90" y="-90" transform="rotate(45 90 -90)" opacity="0.05" />
      <use href="#leaf-motif" x="90" y="270" transform="rotate(45 90 270)" opacity="0.05" />
      <use href="#leaf-motif" x="-90" y="90" transform="rotate(45 -90 90)" opacity="0.05" />
      <use href="#leaf-motif" x="270" y="90" transform="rotate(45 270 90)" opacity="0.05" />
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="#F4FBFF" />
  
  <!-- Pattern overlay -->
  <rect width="100%" height="100%" fill="url(#luxury-pattern)" />
</svg>
